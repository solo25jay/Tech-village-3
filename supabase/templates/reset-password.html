<!-- Supabase Dashboard > Authentication > Email Templates > Reset password
     Subject: Reset your Tech Village password -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F8FD;padding:28px 12px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #DAE1F2;border-radius:16px">
      <tr><td style="padding:26px 30px 0;font-size:19px;font-weight:800"><span style="color:#0B1D5B">Tech</span> <span style="color:#1F5BFF">Village</span></td></tr>
      <tr><td style="padding:22px 30px 30px;color:#0B1D5B;font-size:15px;line-height:1.6">
        <h1 style="margin:0 0 14px;font-size:22px;line-height:1.25">Reset your password</h1>
        <p style="margin:0 0 20px">We received a request to reset the password for this account. The link works once and expires soon.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1F5BFF;color:#ffffff;text-decoration:none;font-weight:600;padding:13px 22px;border-radius:10px">Choose a new password</a>

      </td></tr>
    </table>
  </td></tr>
